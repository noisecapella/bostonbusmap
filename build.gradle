// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        jcenter()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
    }
}

apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    jcenter()
    google()
}

dependencies {
    implementation 'androidx.annotation:annotation:1.0.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.gms:play-services-base:17.+'
    implementation 'com.google.android.gms:play-services-location:17.+'
    implementation 'com.google.android.gms:play-services-maps:17.+'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.guava:guava:22.0-android'
    implementation 'com.google.code.findbugs:jsr305:1.3.9'

    implementation 'com.android.support:support-annotations:27+'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.protobuf:protobuf-lite:3.0.1'
    implementation "androidx.preference:preference-ktx:1.2.0"
}

android {
    compileSdkVersion 36
    namespace "boston.Bus.Map"
    buildTypes {
        release {
            minifyEnabled true
            proguardFile 'proguard-project.txt'
            debuggable false
        }

    }
    sourceSets {
        main {
            manifest.srcFile './AndroidManifest.xml'
            java {
                srcDir 'src'
            }
            res {
                srcDir 'res'
            }
        }
    }
    signingConfigs {
        release {
            release {
                def configName = 'release'
                def propsFile = rootProject.file('keystore.properties')
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile = file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']

            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    testOptions.unitTests.includeAndroidResources true
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
    }
}

allprojects {
    repositories {
        mavenCentral()
        jcenter()
        google()
    }
    afterEvaluate { project ->
        def propsFile = rootProject.file('keystore.properties')
        def configName = 'release'

        if (propsFile.exists() && android.signingConfigs.hasProperty(configName)) {
            def props = new Properties()
            props.load(new FileInputStream(propsFile))

            //android.buildTypes[configName].signingConfig = android.signingConfigs[configName]
        }
    }
}